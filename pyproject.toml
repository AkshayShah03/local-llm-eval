[project]
name = "local-llm-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27", "numpy>=2.0", "pyyaml>=6.0", "psutil>=6.0", "matplotlib>=3.9",
  "jsonschema>=4.23", "fastapi>=0.115", "uvicorn>=0.32", "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalh", "gateway"]

[tool.pytest.ini_options]
markers = ["ollama: needs a running local Ollama server"]
addopts = "-m 'not ollama'"
asyncio_mode = "auto"
